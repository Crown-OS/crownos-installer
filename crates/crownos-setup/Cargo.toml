[package]
name = "crownos-setup"
version = "0.1.0"
edition = "2024"
description = "Installs the post-install choices of CrownOS in the background"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crownos-config = { workspace = true }
crownos-setup-tasks = { workspace = true }
serde_json = { workspace = true }
