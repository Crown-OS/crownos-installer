[package]
name = "crownos-setup-tasks"
version = "0.1.0"
edition = "2024"
description = "The post-install tasks that the crownos-setup runner does"

[features]
fake = []

[dependencies]
crownos-config = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
# `preserve_order` keeps the key order of the agent files that the merge rewrites.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# Edits `~/.codex/config.toml` and keeps its comments and formatting.
toml_edit = { workspace = true }
tracing = { workspace = true }
