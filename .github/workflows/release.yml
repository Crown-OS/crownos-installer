# Builds the crownos-installer and crownos-setup packages from packaging/ on a
# v* tag and publishes both on the release, where Crown-OS/crownos-iso picks
# them up.
#
# Crown-OS/.github's arch-package.yml puts every binary of the workspace into
# one package, but crownos-setup ships units, a polkit action and system
# configuration of its own, so this builds our own PKGBUILDs instead.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: build and publish
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: Crown-OS/.github/.github/actions/prepare-workspace@main
        with:
          toolchain: 1.97.1

      - name: Package
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            sed -i "s/^pkgver=.*/pkgver=${version//-/_}/" crownos-installer/packaging/{crownos-installer,crownos-setup}/PKGBUILD
          fi
          useradd --create-home builder
          mkdir -p out
          chown -R builder .
          runuser -u builder -- rustup default 1.97.1
          for package in crownos-installer crownos-setup; do
            (cd "crownos-installer/packaging/$package" &&
              runuser -u builder -- env PKGDEST="$GITHUB_WORKSPACE/out" makepkg --nodeps --noconfirm)
          done

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --clobber

  notify-iso:
    name: rebuild the ISO
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CROWNOS_ISO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CROWNOS_ISO_DISPATCH_TOKEN is not set; crownos-iso picks this release up on its next build."
            exit 0
          fi
          gh api repos/Crown-OS/crownos-iso/dispatches \
            -f event_type=component-updated -f "client_payload[repository]=$GITHUB_REPOSITORY"
