# Formats, builds, lints and tests on every push and pull request. Logic lives
# in Crown-OS/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Crown-OS/.github/.github/workflows/rust.yml@main
    with:
      toolchain: 1.97.1

  # The NetworkManager hook of crownos-setup, with a fake systemctl.
  hook-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh packaging/crownos-setup/network/50-crownos-setup.test.sh
