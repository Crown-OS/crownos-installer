[package]
name = "crownos-installer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crownos-installer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blinc_icons = "0.5.1"
# The kiosk UI is built out of the CrownOS widget kit, so the first thing the
# user sees looks like the desktop it is about to install rather than like a
# rescue tool.
crownuikit = { path = "../crownuikit" }
# Only for the `appearance` section the kit themes from. The installer writes no
# config of its own — the system it configures lives under `/mnt`.
crownos-config = { path = "../crownos-config" }
serde = { version = "1", features = ["derive"] }
# `oobe.json` is JSON rather than RON. See `src/oobe.rs` for why.
serde_json = "1"
winit = "0.30.13"
xilem = "0.4.0"

[profile.dev]
# See https://doc.rust-lang.org/cargo/reference/profiles.html#split-debuginfo
split-debuginfo = "unpacked"

[patch.crates-io]
vello_encoding = { path = "../vendor/vello_encoding-0.6.0" }
